[books-dev]
image=docker.io/library/archlinux:latest
pull=true
home=/home/himlen/Documents/Projets/books/.home
pre_init_hooks="cp /run/host/etc/pacman.d/mirrorlist /etc/pacman.d/mirrorlist"
additional_packages="base-devel rustup sqlite git"

# Dev tools
additional_packages="helix starship"

# Debugging and inspection tools
additional_packages="openbsd-netcat jq"

# Web development language servers (HTML, CSS, JSON, JavaScript)
additional_packages="vscode-html-languageserver vscode-css-languageserver vscode-json-languageserver"
additional_packages="typescript-language-server typescript"

